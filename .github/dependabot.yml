# Dependabot version updates. Security updates for the pinned set are separate
# and automatic once the dependency graph is enabled on the repo.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    # Version-update PRs are off for pip: CI installs requirements.txt with
    # requirements.lock as a CONSTRAINTS file, and Dependabot only edits
    # requirements.txt, so every such PR conflicted with the lock and failed.
    # Update by hand (`make lock`) instead. Dependabot SECURITY updates are
    # separate and still open PRs automatically.
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; TS 7 breaks `npm ci`.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Bumps the digest-pinned base images (python, node, nginx) in the Dockerfiles.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
