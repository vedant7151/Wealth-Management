[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = False
; Phase 5 scopes mypy to compliance/, api.py, ratelimit.py, llm_client.py
; only (per the master prompt) -- agent.py/scheduler.py/etc. are reachable
; via imports but not themselves in scope this phase, so their errors are
; silenced rather than failing this phase's CI job for files nobody asked
; to type-check yet.
follow_imports = silent
