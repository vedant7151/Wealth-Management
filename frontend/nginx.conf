# Serves the static Vite build and falls back to index.html for any
# unmatched path, since this is a client-side-routed SPA (App.tsx owns
# all routing, not the server).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (Phase 10). `always` so they are also sent on error
    # responses. The CSP's connect-src must list the API origin(s): the
    # localhost entries serve the docker-compose/local setup, *.onrender.com
    # matches render.yaml -- a custom API domain needs adding here AND in
    # vercel.json (see docs/OPERATIONS.md "Frontend CSP"). Not verified in a
    # real browser against Clerk's hosted widgets; check the console for CSP
    # violations on first deploy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.clerk.accounts.dev https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://img.clerk.com; connect-src 'self' http://localhost:8010 http://127.0.0.1:8010 https://*.onrender.com https://*.clerk.accounts.dev https://clerk-telemetry.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # HSTS only takes effect over HTTPS (browsers ignore it on plain HTTP), so
    # it is harmless on the local http container and correct behind TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }
}
